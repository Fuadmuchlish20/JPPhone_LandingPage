# Minimal Supabase CLI config for local dev: `supabase start --workdir infra`
project_id = "claudeemulator"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]

# "Continue with Google". Set the two env vars, flip enabled to true, then `supabase stop && supabase start`.
# Google Cloud console → OAuth client (Web) → authorized redirect URI: http://127.0.0.1:54321/auth/v1/callback
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[auth.email]
enable_signup = true
enable_confirmations = false
